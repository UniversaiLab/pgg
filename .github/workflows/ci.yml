name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run test
      - run: bun run build:web
      - run: bun run size

  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1
      - run: forge fmt --check
      - run: forge build
      - run: forge test
      # Chain tests deploy the real contracts to a local anvil. They skip on the plain `check` job (no
      # Foundry there); here a missing prerequisite is a failure.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install JS dependencies
        working-directory: .
        run: bun install --frozen-lockfile
      - name: Chain tests against a local anvil
        working-directory: .
        env:
          PGG_REQUIRE_CHAIN_TESTS: '1'
        # The server's chain tests (the FakeChain-vs-anvil parity test) live with the server code; the plain
        # vault server tests in the same folder run again here, which is cheap.
        run: bun test ./packages/vault ./apps/server/test/vault
